<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blueberry Mac OS Banner</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", sans-serif;
        }
        
        /* Gentle, refined soft blue typography (periwinkle / soft sky blue) */
        .soft-blue-heading {
            color: #7dd3fc; /* Soft sky blue */
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.9), 0 0 16px rgba(15, 23, 42, 0.8);
        }

        .soft-blue-sub {
            color: #bae6fd; /* Slightly lighter soft blue */
            text-shadow: 0 4px 16px rgba(0, 0, 0, 0.9), 0 0 12px rgba(15, 23, 42, 0.8);
        }

        .arrow-glow {
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.9)) drop-shadow(0 0 8px rgba(125, 211, 252, 0.4));
        }
    </style>
</head>

<body class="relative h-screen w-screen flex flex-col items-center justify-center p-4 select-none overflow-hidden bg-cover bg-center bg-no-repeat bg-fixed"
      style="background-image: linear-gradient(to bottom, rgba(15, 23, 42, 0.60), rgba(15, 23, 42, 0.70)), url('https://images.unsplash.com/photo-1595231712325-32efa0628373?auto=format&fit=crop&w=1920&q=80');">

    <!-- 1. Top Section: Pinned directly at the top edge -->
    <header class="absolute top-1 left-0 right-0 flex flex-col items-center justify-center text-center z-20">
        <!-- Small arrow pointing up -->
        <div class="text-[#7dd3fc] arrow-glow mb-0.5">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 sm:h-4 sm:w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 10l7-7m0 0l7 7m-7-7v18" />
            </svg>
        </div>
        <!-- Big bold text directly below arrow -->
        <h2 class="text-xl sm:text-3xl md:text-4xl font-black tracking-wider uppercase leading-tight soft-blue-heading">
            TYPE UP HERE
        </h2>
    </header>

    <!-- 2. Middle Section: Centered on screen -->
    <main class="w-full max-w-6xl flex flex-col items-center justify-center text-center z-10 px-4">
        <!-- Main huge title -->
        <h1 class="text-5xl sm:text-7xl md:text-8xl lg:text-9xl font-black tracking-tight leading-tight mb-4 soft-blue-heading">
            Hi! Welcome to Blueberry Mac OS
        </h1>
        
        <!-- Disclaimer directly below -->
        <p class="text-2xl sm:text-4xl md:text-5xl font-bold tracking-wide italic soft-blue-sub">
            (apple plz don't sue me)
        </p>
    </main>

</body>
</html>
